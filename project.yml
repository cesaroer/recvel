name: Recvel
options:
  bundleIdPrefix: com.recvel
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8VUPJLK9PY
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 5.0
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Recvel:
    type: application
    platform: iOS
    sources:
      - path: Recvel
        excludes:
          - App/Info.plist
          - Recvel.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recvel.app
        PRODUCT_NAME: Recvel
        INFOPLIST_FILE: Recvel/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Recvel/Recvel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: RecvelWidgets
        embed: true
      - target: RecvelWatch
        embed: true

  RecvelWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RecvelWidgets
        excludes:
          - Info.plist
          - RecvelWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recvel.app.widgets
        PRODUCT_NAME: RecvelWidgets
        INFOPLIST_FILE: RecvelWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: RecvelWidgets/RecvelWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  RecvelWatch:
    type: application
    platform: watchOS
    sources:
      - path: RecvelWatch
        excludes:
          - Info.plist
          - RecvelWatch.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recvel.app.watchkitapp
        PRODUCT_NAME: RecvelWatch
        INFOPLIST_FILE: RecvelWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: RecvelWatch/RecvelWatch.entitlements
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - target: RecvelWatchWidgets
        embed: true

  RecvelWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: RecvelWatchWidgets
        excludes:
          - Info.plist
          - RecvelWatchWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recvel.app.watchkitapp.widgets
        PRODUCT_NAME: RecvelWatchWidgets
        INFOPLIST_FILE: RecvelWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: RecvelWatchWidgets/RecvelWatchWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  RecvelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecvelTests
    dependencies:
      - target: Recvel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recvel.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO

  RecvelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RecvelUITests
    dependencies:
      - target: Recvel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recvel.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  Recvel:
    build:
      targets:
        Recvel: all
        RecvelWidgets: all
        RecvelWatch: all
        RecvelWatchWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecvelTests
        - RecvelUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  RecvelWatch:
    build:
      targets:
        RecvelWatch: all
        RecvelWatchWidgets: all
    run:
      config: Debug
